# ==============================================================================
# PaperSeasons v1.2.1 ("Active Snow & Ice Thaw Update")
# Architecture Haute Performance (Raspberry Pi 5 ARM64 + Playit.gg + Terralith)
# Objectif CPU : < 0.5 ms MSPT (Zéro scan de blocs par tick, caches EnumMap O(1))
# ==============================================================================

# Mondes actifs (exclut automatiquement le Nether/Incendium et l'End)
enabled-worlds:
  - "world"

# Configuration du calendrier astronomique (12 sous-saisons = 3 phases par saison)
calendar:
  # Durée d'une saison complète en jours Minecraft (ex: 9 jours = 3 jours par sous-saison EARLY/MID/LATE)
  days-per-season: 9
  # Intervalle d'évaluation du contrôleur DO_DAYLIGHT_CYCLE (en ticks)
  daylight-cycle-check-interval-ticks: 2

# Événements climatiques saisonniers rares (v1.2.0)
events:
  enabled: true
  daily-trigger-chance: 0.20
  blizzard-extra-cold: -8.0
  heatwave-extra-heat: 7.0
  autumn-mist-fishing-multiplier: 0.60
  spring-bloom-multiplier: 2.0

# Définition des 4 saisons majeures et de leurs 12 sous-saisons progressives
seasons:
  SPRING:
    display-name: "<gradient:#76FF03:#64DD17>🌱 Printemps</gradient>"
    client-biome-key: "paperseasons:spring_mid"
    temperature-modifier: 0.0
    diurnal-amplitude: 4.5
    day-speed-multiplier: 1.0
    night-speed-multiplier: 1.0
    weather-cold-penalty: -1.5
    rain-chance-multiplier: 1.2
    crop-growth-boost-chance: 0.25
    ice-snow-melt-enabled: true
    breeding-twin-chance: 0.25
    fishing-wait-multiplier: 0.75
    sub-seasons:
      EARLY:
        display-name: "<gradient:#AEEA00:#76FF03>🌱 Début de Printemps</gradient>"
        client-biome-key: "paperseasons:spring_early"
        temperature-modifier: -3.5
      MID:
        display-name: "<gradient:#76FF03:#64DD17>🌷 Cœur du Printemps</gradient>"
        client-biome-key: "paperseasons:spring_mid"
        temperature-modifier: 0.5
      LATE:
        display-name: "<gradient:#64DD17:#00E676>🌿 Fin de Printemps</gradient>"
        client-biome-key: "paperseasons:spring_late"
        temperature-modifier: 5.0

  SUMMER:
    display-name: "<gradient:#FFD600:#FF6D00>☀️ Été</gradient>"
    client-biome-key: "paperseasons:summer_mid"
    temperature-modifier: 12.0
    diurnal-amplitude: 5.5
    day-speed-multiplier: 0.65
    night-speed-multiplier: 1.0
    weather-cold-penalty: -1.0
    rain-chance-multiplier: 0.4
    crop-growth-boost-chance: 0.15
    ice-snow-melt-enabled: true
    breeding-twin-chance: 0.05
    fishing-wait-multiplier: 0.90
    sub-seasons:
      EARLY:
        display-name: "<gradient:#C6FF00:#FFD600>☀️ Début d'Été</gradient>"
        client-biome-key: "paperseasons:summer_early"
        temperature-modifier: 9.0
      MID:
        display-name: "<gradient:#FFD600:#FF6D00>🔥 Plein Été</gradient>"
        client-biome-key: "paperseasons:summer_mid"
        temperature-modifier: 13.5
      LATE:
        display-name: "<gradient:#FFAB00:#FF8F00>🌾 Fin d'Été</gradient>"
        client-biome-key: "paperseasons:summer_late"
        temperature-modifier: 9.5

  AUTUMN:
    display-name: "<gradient:#FF9100:#D45B12>🍂 Automne</gradient>"
    client-biome-key: "paperseasons:autumn_mid"
    temperature-modifier: -4.0
    diurnal-amplitude: 4.0
    day-speed-multiplier: 1.0
    night-speed-multiplier: 0.85
    weather-cold-penalty: -2.5
    rain-chance-multiplier: 1.5
    crop-growth-boost-chance: 0.0
    ice-snow-melt-enabled: false
    breeding-twin-chance: 0.0
    fishing-wait-multiplier: 0.75
    sub-seasons:
      EARLY:
        display-name: "<gradient:#FFD54F:#FF9100>🍁 Début d'Automne</gradient>"
        client-biome-key: "paperseasons:autumn_early"
        temperature-modifier: 2.5
      MID:
        display-name: "<gradient:#FF9100:#D45B12>🍂 Cœur de l'Automne</gradient>"
        client-biome-key: "paperseasons:autumn_mid"
        temperature-modifier: -4.0
      LATE:
        display-name: "<gradient:#D45B12:#8D6E63>🌫️ Fin d'Automne</gradient>"
        client-biome-key: "paperseasons:autumn_late"
        temperature-modifier: -9.5

  WINTER:
    display-name: "<gradient:#80D8FF:#E1F5FE>❄️ Hiver</gradient>"
    client-biome-key: "paperseasons:winter_mid"
    temperature-modifier: -18.0
    diurnal-amplitude: 3.5
    day-speed-multiplier: 1.0
    night-speed-multiplier: 0.65
    weather-cold-penalty: -4.0
    rain-chance-multiplier: 1.3
    crop-growth-boost-chance: 0.0
    ice-snow-melt-enabled: false
    min-block-light-to-grow: 12
    greenhouse-max-glass-height: 12
    breeding-outdoor-fail-chance: 0.50
    fishing-wait-multiplier: 1.35
    snow-accumulation-columns-per-check: 8
    sub-seasons:
      EARLY:
        display-name: "<gradient:#B0BEC5:#80D8FF>🌨️ Début d'Hiver</gradient>"
        client-biome-key: "paperseasons:winter_early"
        temperature-modifier: -14.0
      MID:
        display-name: "<gradient:#80D8FF:#E1F5FE>❄️ Grand Hiver</gradient>"
        client-biome-key: "paperseasons:winter_mid"
        temperature-modifier: -18.5
      LATE:
        display-name: "<gradient:#80D8FF:#A5D6A7>💧 Fin d'Hiver (Dégel)</gradient>"
        client-biome-key: "paperseasons:winter_late"
        temperature-modifier: -10.5

# ==============================================================================
# Thermorégulation réaliste v1.1 (O(1) - Exécutée toutes les 40 ticks / 2s)
# ==============================================================================
thermoregulation:
  enabled: true
  check-interval-ticks: 40
  biome-base-temp-multiplier: 20.0
  altitude-sea-level: 64
  altitude-factor-per-block: 0.05
  block-light-heat-multiplier: 0.8

  # Atténuation de l'amplitude diurne (jour/nuit) de 80% sous abri (SkyLight < 10) ou sous la pluie
  diurnal-sheltered-attenuation: 0.20

  # Isolation thermique intérieure / grottes (O(1) via block.getLightFromSky())
  indoor-sky-light-threshold: 10
  indoor-season-mitigation-factor: 0.30

  # Humidité / Mouillure ("Wetness" 0..100%) & Wind Chill (Vent d'altitude)
  wetness:
    rain-gain-no-helmet: 15
    rain-gain-with-helmet: 5
    passive-dry-rate: 5
    heated-dry-rate: 25
    heated-dry-min-block-light: 12
    max-wet-cold-penalty: 8.0
    summer-cooling-threshold-celsius: 32.0
    max-summer-wet-relief: 6.0

  wind-chill:
    min-altitude-y: 95
    min-sky-light: 13
    factor-per-block-above-min: 0.08
    max-base-wind-chill: 6.0
    storm-multiplier: 2.0

  # Buffs thermiques alimentaires & Synergie BreweryX
  brewery-winter-warmth-bonus: 3.0
  consumable-buffs:
    cooling-buff-celsius: -4.0
    cooling-duration-seconds: 60
    cooling-min-ambient-temp: 30.0
    warming-buff-celsius: 4.0
    warming-duration-seconds: 90

  # Seuils critiques (°C) & Dégâts directs d'hypothermie
  freeze-threshold-celsius: 0.0
  freeze-ticks-added-per-check: 55
  hypothermia-damage: 1.0
  hypothermia-severe-damage: 2.0
  hypothermia-severe-threshold-celsius: -10.0
  hypothermia-damage-after-checks: 2
  heatstroke-threshold-celsius: 38.0
  heatstroke-exhaustion-added: 0.35

  # Bonus thermique par pièce d'armure équipée (°C) -> EnumMap<Material, Double>
  armor-bonus:
    leather-per-piece: 2.5
    chainmail-per-piece: -0.5
    iron-per-piece: -1.0
    gold-per-piece: -0.5
    diamond-per-piece: -1.0
    netherite-per-piece: 1.5
    # v1.2.0 : Enchantement Protection contre le feu (-0.75°C par niveau en cas de forte chaleur > 30°C)
    fire-protection-cooling-per-level: 0.75
    # v1.2.0 : Porter >= 1 pièce en Cuir ou une Garniture (Quartz/Or/Améthyste) réduit de 50% le froid du Fer/Diamant
    insulated-metal-cold-reduction-factor: 0.50

  # Chaleur apportée par un objet tenu en main principale ou secondaire (°C) -> EnumMap<Material, Double>
  held-item-heat:
    TORCH: 3.0
    SOUL_TORCH: 1.5
    LANTERN: 4.0
    SOUL_LANTERN: 2.0
    LAVA_BUCKET: 8.0
    BLAZE_ROD: 5.0
    MAGMA_CREAM: 3.0
    CAMPFIRE: 4.0
    SOUL_CAMPFIRE: 2.0

# Affichage UI (Kyori Adventure MiniMessage)
ui:
  actionbar-enabled: true
  temperature-delta-threshold: 0.5
  format-normal: "<dark_gray>[</dark_gray><season><dark_gray>] <gray>｜ <aqua>🌡️ <temp>°C<badges></aqua>"
  format-freezing: "<dark_gray>[</dark_gray><season><dark_gray>] <gray>｜ <aqua>🥶 <bold><temp>°C (Gel !)<badges></bold></aqua>"
  format-overheating: "<dark_gray>[</dark_gray><season><dark_gray>] <gray>｜ <gold>🔥 <bold><temp>°C (Canicule !)<badges></bold></gold>"

# Hook Réseau Autonome Netty (Spoofing Visuel 3D des 12 sous-saisons sans dépendance obligatoire)
packet-biome-spoofing:
  enabled: true
  preserve-nether-and-end: true
  preserve-ocean-and-cave-biomes: true
  min-surface-y: 48
